version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimitra_postgres
    restart: always
    environment:
      POSTGRES_USER: agrimitra
      POSTGRES_PASSWORD: postgres_password_change_me
      POSTGRES_DB: agrimitra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimitra -d agrimitra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
